# ========================================================
# SKIN SETTINGS - Altere os valores aqui
# ========================================================
[definitions]
note_width  = 0.08
note_height = 0.05
hit_line_y  = 0.85
track_left  = 0.34
spacing     = 0.082

# ========================================================
# ELEMENTOS DA INTERFACE
# ========================================================

[track]
texture = esteira.png
width   = 0.25
height  = 1
pos_x   = 0.6
pos_y   = 0
pos_z   = 0
opacity = 0

[score]
texture = font/0-9.png
width   = 0
height  = 0
pos_x   = 0
pos_y   = 0

[combo]
texture = font/0-9.png
width   = 0
height  = 0
pos_x   = 0.425
pos_y   = 0.4

[accuracy]
texture = font/0-9.png
width   = 0
height  = 0
pos_x   = 0.425
pos_y   = 0.4

[judge]
texture = judge/0-5.png
width   = 0
height  = 0
pos_x   = 0.425
pos_y   = 0.4

[health]
texture = health/0-1.png
width   = 0
height  = 0
pos_x   = 0.425
pos_y   = 0.4

# ========================================================
# TECLAS (KEYS) E NOTAS
# ========================================================

# Coluna 1
[key_1]
texture = key.png
width   = note_width
height  = note_height
pos_x   = track_left
pos_y   = hit_line_y

[note_1]
texture = blue_note.png
width   = note_width
height  = note_height
pos_x   = track_left
pos_y   = 0

# Coluna 2
[key_2]
texture = key.png
width   = note_width
height  = note_height
pos_x   = track_left + spacing
pos_y   = hit_line_y

[note_2]
texture = red_note.png
width   = note_width
height  = note_height
pos_x   = track_left + spacing
pos_y   = 0

# Coluna 3
[key_3]
texture = key.png
width   = note_width
height  = note_height
pos_x   = track_left + spacing * 2
pos_y   = hit_line_y

[note_3]
texture = red_note.png
width   = note_width
height  = note_height
pos_x   = track_left + spacing * 2
pos_y   = 0

# Coluna 4
[key_4]
texture = key.png
width   = note_width
height  = note_height
pos_x   = track_left + spacing * 3
pos_y   = hit_line_y

[note_4]
texture = blue_note.png
width   = note_width
height  = note_height
pos_x   = track_left + spacing * 3
pos_y   = 0

# Outros elementos
[long_notes]
texture = esteira.png
width   = 0
height  = 0

[hitpress]
texture = esteira.png
width   = 0
height  = 0
